<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PicFrame Manager</title>
<link href="static/style.css" rel="stylesheet">
<style type="text/css">
.edtact {
	color:orange;
	margin-right: 0.5rem;
}
.edtact:hover {
	color: crimson;
	cursor: pointer;
}
.rfract {
	color:lightblue;
	margin-right: 0.5rem;
}
.rfract:hover {
	color: blue;
	cursor: pointer;
}
.delact {
	color:coral;
	margin-left: 0.5rem;
}
.delact:hover {
	color: red;
	cursor: pointer;
}
#podlg, #pledtdlg {
	position: absolute;
	right: 5em;
	top: 5em;
	display: none;
	border: 1px solid #AAA;
	padding: 1rem;
	border-radius: 0.2rem;
	background-color: aliceblue;
	font-size: larger;
	box-shadow: #CCC 0.2rem 0.2rem 1rem;
}
#pledtdlg {
	left: 10em;
	right: auto;
	top: 10em;
}
#update {
	font-size: larger;
}
.edform {
	display: grid;
	grid-template-columns: auto auto;
	column-gap: .5rem;
	row-gap: .4rem;
}
.edform input {
	font-size: large;
}
.act, .pledact {
	margin-top: 0.5rem;
	border-top: 1px solid #CCC;
	padding-top: 0.5rem;
}
.act button {
	font-size: large;
}
.pledact {
	display: flex;
	justify-content: flex-end;
}
.pledact button {
	font-size: large;
	margin-left: 1rem;
}
#hdr a {
	font-size: large;
	margin-left: 1rem;
}
#updating {
	display: none;
	position: absolute;
	left: 0;
	top: 4em;
	width: 100%;
	text-align: center;
	font-size: xxx-large;
	color: cadetblue;
	opacity: .5;
}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
	integrity="sha512-SfTiTlX6kk+qitfevl/7LibUOeJWlt9rbyDn92a1DqWOw9vWG2MFoays0sgObmWazO5BQPiFucnnEAjpAB+/Sw=="
	crossorigin="anonymous" referrerpolicy="no-referrer" />
<script>
	if (!localStorage.getItem('adminok')) {
		if (prompt('Please validate','')=='%%ADMIN_PASSWORD%%') {
			localStorage.setItem('adminok', true);
		} else {
			history.back();
		}
	}
</script>
</head>
<body>
<div id="hdr"><span>Picture Frame Admin</span><a href="/">(return to dashboard)</a><i class="fa fa-power-off" aria-hidden="true" onclick="doPO()"></i></div>
<!-- Tab links -->
<div class="tab">
	<button class="tablinks" onclick="openCity(event, 'playlists')" id="defaultOpen">Playlists</button>
	<button class="tablinks" onclick="openCity(event, 'actions')">Actions</button>
	<button class="tablinks" onclick="openCity(event, 'settings')">Settings</button>
	<button class="tablinks" onclick="openCity(event, 'update')">Update</button>
</div>
<div id="playlists" class="tabcontent">
	<div id="plists"></div>
</div>
<div id="settings" class="tabcontent">
	<form action="/settings" name="setsform" id="setsform">
		<div>
			<label for="timeon">Time of day to begin:</label>
			<input type="time" id="timeon" name="timeon" value="07:00">
		</div>
		<div>
			<label for="timeoff">Time of day to stop: </label>
			<input type="time" id="timeoff" name="timeoff" value="17:25">
		</div>
	</form>
	<button onclick="saveSets()">Save Settings</button>
</div>
<div id="actions" class="tabcontent">
	<button onclick="dspSet(0)">Display Off</button>
	<button onclick="dspSet(1)">Display On</button>
</div>
<div id="update" class="tabcontent" data-action="updateGet">
	<div>Checking ...</div>
</div>
<div id="pledtdlg">
	<div class="edform">
		<label for="plNam">Playlist Name: </label><input type="text" id="plNam" name="plNam" value="">
		<label for="plDly">Delay (sec): </label><input type="number" id="plDly" name="plDly" min="20" step="10" value="">
	</div>
	<div class="pledact"><button onclick="plSav(false)"> Cancel </button><button onclick="plSav(true)"> Save </button></div>
</div>
<div id="podlg">
	<input type="radio" id="poOff" name="poOpt" value="poff" checked> <label for="poOff">Shut Down</label><br>
	<input type="radio" id="poBoot" name="poOpt" value="boot"> <label for="poBoot">Restart</label>
	<div class="act"><button onclick="poAct(false)"> Cancel </button>&nbsp;&nbsp;&nbsp;<button onclick="poAct(true)"> Do It </button></div>
</div>
<div id="updating"><i class="fa fa-cog fa-spin fa-4x fa-fw"></i></div>
<script>
	var actvl = null;
	var ovs = {};
	document.getElementById('plists').addEventListener('click', evt => {
		console.log(evt);
		let lem = evt.target;
		let pln = lem.dataset.pln;
		if (!pln) { lem = lem.parentElement; pln = lem.dataset.pln; }
		if (!pln) return;
		let actr = lem.className;
		switch (actr) {
			case 'delact':
				if (confirm('Are you sure that you want to delete this playlist?')) {
					fetch(galURL+'/?delp='+pln, {method:'GET'})
					.then(resp => { console.log(resp); if (!resp.ok) throw new Error(`HTTP ${resp.status}`); if (true) return resp.json(); else return resp.text() })
					.then(data => {
						console.log(data);
						location.reload();
					})
					.catch(err => alert('Failure: '+err));
				}
				break;
			case 'rfract':
				if (confirm('An attempt will be made to refresh the playlist on the photo frame, reflecting gallery changes ... continue?')) {
					fetch(galURL+'/?refr='+pln, {method:'GET'})
					.then(resp => { console.log(resp); if (!resp.ok) throw new Error(`HTTP ${resp.status}`); if (true) return resp.json(); else return resp.text() })
					.then(data => {
						console.log(data);
						location.reload();
					})
					.catch(err => alert('Failure: '+err));
				}
				break;
			case 'edtact':
				doPled(pln, lem.dataset.sdly);
		}
	});
	const galURL = '%%LOCAL_PICFRAME%%';
	const getList = () => {
		fetch(galURL+'/?cmd=lists', {method:'GET'})
		.then(resp => { console.log(resp); if (!resp.ok) throw new Error(`HTTP ${resp.status}`); if (true) return resp.json(); else return resp.text() })
		.then(data => {
			console.log(data);
			if (!data.lists.length) {
				document.getElementById('plists').innerHTML = '<h2>NO PLAYLISTS WERE FOUND</h2>';
				return;
			}
			let curr = data.curlst;
			let lnks = data.lists.map(lst => {
				let actc = lst.ttl==curr ? ' activ' : '';
				let dlbt = lst.ttl==curr ? '' : `<span class="delact" data-pln="${lst.ttl}"> <i class="fa fa-times" aria-hidden="true"></i></span>`;
				let prps = `${lst.pcnt} Photos : ${lst.sdly} Seconds`;
				let refr = `<span class="rfract" data-pln="${lst.ttl}"> <i class="fa fa-refresh" aria-hidden="true"></i></span>`;
				let edt = lst.ttl==curr ? '' : `<span class="edtact" data-pln="${lst.ttl}" data-sdly="${lst.sdly}"> <i class="fa fa-pencil-square-o" aria-hidden="true"></i></span> `;
				let ttl = atob(lst.ttl);
				return `<div class="plst${actc}"><div class="plst-ttl">${edt}${refr} ${ttl} ${dlbt}</div><div>${prps}</div></div>`;
			});
			document.getElementById('plists').innerHTML = lnks.join('<br>');
			actvl = document.querySelector('.plst.activ');
		})
		.catch(err => alert('Failure: '+err));
	}
	const doPled = (pln, sdly) => {
		console.log(pln);
		const dlg = document.getElementById('pledtdlg');
		dlg.querySelector('#plNam').value = ovs.pln = atob(pln);
		dlg.querySelector('#plDly').value = ovs.sdly = sdly;
		dlg.style.display = 'block';
	};
	const plSav = (save) => {
		const dlg = document.getElementById('pledtdlg');
		dlg.style.display = 'none';
		if (save) {
			const pln = dlg.querySelector('#plNam').value.trim();
			const sdly = dlg.querySelector('#plDly').value.trim();
			if (sdly == ovs.sdly && pln == ovs.pln) {
				alert('no change');
				return;
			}
			const vals = `pln=${btoa(ovs.pln)}&npln=${btoa(pln)}&nsdly=${sdly}`;
			fetch('/edt?'+vals, {method:'GET'})
			.then(resp => { console.log(resp); if (!resp.ok) throw new Error(`HTTP ${resp.status}`); if (false) return resp.json(); else return resp.text() })
			.then(data => {
				alert(data);
				getList();
			})
			.catch(err => alert('Failure: '+err));
		}
	};
	const doPO = () => {
		document.getElementById('podlg').style.display = 'inline-block';
	};
	const poAct = (doit) => {
		document.getElementById('podlg').style.display = 'none';
		if (doit) {
			let act = document.querySelector('input[name="poOpt"]:checked').value;
			fetch(galURL+'/?cmd='+act, {method:'GET'})
			.then(resp => { console.log(resp); if (!resp.ok) throw new Error(`HTTP ${resp.status}`); if (false) return resp.json(); else return resp.text() })
			.then(data => {
				console.log(data);
				document.getElementById('plists').innerHTML = data;
			})
			.catch(err => alert('Failure: '+err));
		}
	};
	const totimv = (tval) => {
		tval = tval.padStart(4,'0');
		let ret = tval.substr(0, tval.length-2) + ':' + tval.substr(-2);
		console.log(ret);
		return ret;
	};
	const getSets = () => {
		fetch('/?cmd=getset', {method:'GET'})
		.then(resp => { console.log(resp); if (!resp.ok) throw new Error(`HTTP ${resp.status}`); if (true) return resp.json(); else return resp.text() })
		.then(data => {
			console.log(data);
			document.getElementById('timeon').value = totimv(''+data.ontime);
			document.getElementById('timeoff').value = totimv(''+data.offtime);
		})
		.catch(err => alert('Failure: '+err));
	};
	const saveSets = () => {
		let fData = new FormData(setsform);
		let urls = new URLSearchParams(fData).toString();
		fetch('/settings?'+urls, {method:'GET'})
		.then(resp => { console.log(resp); if (!resp.ok) throw new Error(`HTTP ${resp.status}`); if (false) return resp.json(); else return resp.text() })
		.then(data => {
			alert(data);
		})
		.catch(err => alert('Failure: '+err));
	};
	const dspSet = (oo) => {
		fetch(galURL+'/?cmd=dsp&oo='+oo, {method:'GET'})
		.then(resp => { console.log(resp); if (!resp.ok) throw new Error(`HTTP ${resp.status}`); if (false) return resp.json(); else return resp.text() })
		.then(data => {
			console.log(data);
			setTimeout(() => alert(data), 10);
		})
		.catch(err => alert('Failure: '+err));
	};
	const updateNow = () => {
		if (!confirm('Are you sure that you want to install this update now?')) return;
		document.getElementById('updating').style.display = 'block';
		fetch(galURL+'/?updt=updt', {method:'GET'})
		.then(resp => { console.log(resp); if (!resp.ok) throw new Error(`HTTP ${resp.status}`); if (true) return resp.json(); else return resp.text() })
		.then(data => {
			console.log(data);
			if (data.success) {
				setTimeout(()=>location.reload(), 3000);
			} else {
				document.getElementById('updating').style.display = 'none';
				alert('There was an error in the update process.');
			}
		})
		.catch(err => {
			document.getElementById('updating').style.display = 'none';
			alert('Failure: '+err);
		});
	};
	const functionRegistry = {
		updateGet: function() {
			fetch(galURL+'/?updt=get', {method:'GET'})
			.then(resp => { console.log(resp); if (!resp.ok) throw new Error(`HTTP ${resp.status}`); if (true) return resp.json(); else return resp.text() })
			.then(data => {
				console.log(data);
				let content = '<div>There is no available update.</div>';
				if (!data.UpToDate) {
					content = '<div>There is an available update.</div>';
					content += `<div>Current version: ${data.currentVersion} &raquo;&raquo; New version: ${data.remoteVersion}</div>`;
					content += `<div>${data.updtb}</div>`;
					content += '<button onclick="updateNow()">Update Now</button>';
				}
				document.getElementById('update').innerHTML = content;
			})
			.catch(err => alert('Failure: '+err));
		},
		anotherFunction: function() {
			console.log("Executing another function!");
		}
	};
	const openCity = (evt, cityName) => {
		// Declare all variables
		let i, tabcontent, tablinks;

		// Get all elements with class="tabcontent" and hide them
		tabcontent = document.getElementsByClassName('tabcontent');
		for (i = 0; i < tabcontent.length; i++) {
			tabcontent[i].style.display = 'none';
		}

		// Get all elements with class="tablinks" and remove the class "active"
		tablinks = document.getElementsByClassName('tablinks');
		for (i = 0; i < tablinks.length; i++) {
			tablinks[i].className = tablinks[i].className.replace(' active', '');
		}

		const tabd = document.getElementById(cityName);
		console.log(tabd.dataset.action);
		if (tabd.dataset.action) functionRegistry[tabd.dataset.action]();
		// Show the current tab, and add an "active" class to the button that opened the tab
		tabd.style.display = 'block';
		evt.currentTarget.className += ' active';
	};
	getSets();
	getList();
	document.getElementById('defaultOpen').click();
</script>
</body>
</html>
